openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
servers:
  - url: http://localhost:8080
security: []
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      summary: List all pets
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, pending, sold]
        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              minLength: 2
              maxLength: 10
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: addPet
      tags: [pets]
      summary: Create a pet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid input
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      operationId: getPet
      tags: [pets]
      summary: Get a pet by id
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Not found
    put:
      operationId: updatePet
      tags: [pets]
      summary: Replace a pet with a cat or a dog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Cat'
                - $ref: '#/components/schemas/Dog'
      responses:
        '200':
          description: Updated
        '404':
          description: Not found
    delete:
      operationId: deletePet
      tags: [pets]
      summary: Delete a pet
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
  /pets/{petId}/photo:
    post:
      operationId: uploadPhoto
      tags: [photos]
      summary: Upload a photo (multipart — expected to be skipped by oatg)
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded
  /store/orders:
    post:
      operationId: placeOrder
      tags: [store]
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Order placed
        default:
          description: Unexpected error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      in: query
      name: api_key
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 30
        status:
          type: string
          enum: [available, pending, sold]
        category:
          $ref: '#/components/schemas/Category'
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        status:
          type: string
          enum: [available, pending, sold]
        code:
          type: string
          pattern: '^[A-Z]{3}-[0-9]{4}$'
        birthDate:
          type: string
          format: date
        contactEmail:
          type: string
          format: email
        category:
          $ref: '#/components/schemas/Category'
    Category:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 20
    Cat:
      type: object
      required: [petType, meows]
      properties:
        petType:
          type: string
          enum: [cat]
        meows:
          type: boolean
    Dog:
      type: object
      required: [petType, barkVolume]
      properties:
        petType:
          type: string
          enum: [dog]
        barkVolume:
          type: integer
          minimum: 0
          maximum: 11
    Order:
      type: object
      required: [petId, quantity]
      properties:
        petId:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          multipleOf: 2
        shipDate:
          type: string
          format: date-time
        notes:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            maxLength: 40
